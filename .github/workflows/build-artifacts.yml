name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version used for packaging
        required: true
        default: "3.14"
        type: choice
        options:
          - "3.13"
          - "3.14"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-artifacts.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}

jobs:
  packaged:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: qutebrowser-windows-x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: qutebrowser-macos-intel
          - name: macOS Apple Silicon
            os: macos-14
            artifact: qutebrowser-macos-apple-silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm get.scoop.sh | iex
          scoop update
          scoop bucket add extras
          scoop install nsis
          Add-Content $env:GITHUB_PATH "C:\Users\runneradmin\scoop\shims"

      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U -r misc/requirements/requirements-tox.txt

      - name: Build release packages
        run: tox -e build-release -- --skip-docs --no-confirm --gh-token ${{ github.token }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/qutebrowser-*.dmg
            dist/qutebrowser-*-windows-standalone*.zip
            dist/qutebrowser-*-amd64.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0 \
            libxcb-cursor0

      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U -r misc/requirements/requirements-tox.txt

      - name: Update bundled third-party assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dev/update_3rdparty.py --gh-token "$GITHUB_TOKEN"

      - name: Build standalone bundle
        run: tox -e pyinstaller

      - name: Smoke test standalone bundle
        run: |
          xvfb-run -a dist/qutebrowser/qutebrowser \
            --no-err-windows \
            --nowindow \
            --temp-basedir \
            about:blank \
            ':cmd-later 500 quit'

      - name: Package standalone bundle
        shell: bash
        run: |
          version="$(python -c 'import qutebrowser; print(qutebrowser.__version__)')"
          tar -C dist -czf "dist/qutebrowser-${version}-linux-x86_64.tar.gz" qutebrowser

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: qutebrowser-linux-x86_64
          path: dist/qutebrowser-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
