name: Codex Targeted Workspace Tests

on:
  push:
    branches:
      - codex/fix-terminal-escape-colon-crash

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply terminal Escape binding
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git apply <<'PATCH'
          diff --git a/qutebrowser/config/configdata.yml b/qutebrowser/config/configdata.yml
          --- a/qutebrowser/config/configdata.yml
          +++ b/qutebrowser/config/configdata.yml
          @@ -3888,7 +3888,7 @@ bindings.default:
                 <Ctrl-B>: hint all tab-bg
                 <Escape>: mode-leave
               passthrough:
          -      <Shift-Escape>: mode-leave
          +      <Escape>: mode-leave
               command:
                 <Ctrl-P>: command-history-prev
                 <Ctrl-N>: command-history-next
          PATCH
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qutebrowser/config/configdata.yml
          git commit -m "Use Escape to leave terminal passthrough"
          git push
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-x11 libyaml-dev libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-cursor0 \
            libjpeg-dev
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U -r misc/requirements/requirements-tox.txt
      - name: Run regressions
        run: |
          dbus-run-session -- tox -e py313-pyqt68 -- \
            tests/unit/config/test_workspace_keybindings.py \
            tests/unit/mainwindow/test_workspacehost.py
