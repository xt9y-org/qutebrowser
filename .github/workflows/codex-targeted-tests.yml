name: Codex Targeted Workspace Tests

on:
  push:
    branches:
      - codex/fix-terminal-escape-colon-crash

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-x11 libyaml-dev libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-cursor0 \
            libjpeg-dev
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U -r misc/requirements/requirements-tox.txt
      - name: Run regressions
        run: |
          dbus-run-session -- tox -e py313-pyqt68 -- \
            tests/unit/config/test_workspace_keybindings.py \
            tests/unit/mainwindow/test_workspacehost.py
